<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>GUGU-GBF</title>
  <style>
    :root {
      --bg: #10131c; --card: #1b202e; --card2: #222a3c;
      --text: #e8ebf2; --muted: #8f99af; --accent: #4f7cff;
      --warn: #ffb454; --danger: #ff5c5c; --ok: #3ecf8e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; padding: 14px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .topbar h1 { font-size: 15px; color: var(--accent); }
    .topbar .home { color: var(--muted); font-size: 11px; cursor: pointer; }
    .card { background: var(--card); border-radius: 9px; padding: 12px; margin-bottom: 12px; }
    .card h3 { font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .counts { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .counts .chip { background: var(--card2); padding: 5px 10px; border-radius: 6px; font-size: 12px; }
    .counts .chip b { color: var(--accent); margin-left: 4px; }
    .btn { width: 100%; padding: 9px; border: 0; border-radius: 7px; background: var(--accent); color: #fff; cursor: pointer; font-size: 13px; margin-top: 6px; }
    .btn:hover { opacity: .9; }
    .muted { color: var(--muted); font-size: 11px; }
    .raw-item { background: var(--card2); border-radius: 7px; padding: 8px; margin-bottom: 6px; border-left: 3px solid var(--accent); font-size: 11px; }
    .raw-item b { color: #fff; font-size: 12px; }
    .raw-field { color: var(--muted); }
    .kv { white-space: nowrap; margin-right: 8px; }
    details { margin-top: 6px; }
    summary { font-size: 12px; cursor: pointer; color: var(--muted); margin-bottom: 4px; }
    pre.diag { white-space: pre-wrap; font-family: Consolas, monospace; font-size: 11px; color: var(--muted); background: var(--card2); padding: 8px; border-radius: 6px; }
    .advice { font-size: 12px; border-left: 3px solid var(--accent); padding-left: 8px; margin-bottom: 6px; }
    .advice.high { border-color: var(--danger); }
    .advice.medium { border-color: var(--warn); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>GUGU-GBF 辅助</h1>
    <span class="home" onclick="window.open('https://github.com/gugusama-0721/GUGU-GBF','_blank')">🏠</span>
  </div>

  <div class="card">
    <h3>📡 数据读取状态</h3>
    <div class="counts">
      <span class="chip">角色<b id="c-char">-</b></span>
      <span class="chip">武器<b id="c-weapon">-</b></span>
      <span class="chip">召唤<b id="c-summon">-</b></span>
      <span class="chip">队伍<b id="c-deck">-</b></span>
    </div>
    <div class="muted" id="last-update">尚未读取 · 打开游戏页后自动采集</div>
    <button class="btn" id="btn-refresh">🔄 立即读取已截获数据</button>
    <details open>
      <summary>🔧 诊断信息（排查用）</summary>
      <pre class="diag" id="diag-box">读取中…</pre>
    </details>
    <details>
      <summary>📖 使用说明</summary>
      <div class="muted">打开 GBF 的队伍编成页、角色一览页、武器/召唤页时，扩展自动截获接口并展示。若数量为 0，请先打开对应页面。</div>
    </details>
  </div>

  <div class="card">
    <h3>📦 角色明细</h3>
    <div id="raw-characters" class="raw-list"><i class="muted">暂无角色数据</i></div>
  </div>

  <div class="card">
    <h3>🔫 武器明细</h3>
    <div id="raw-weapons" class="raw-list"><i class="muted">暂无武器数据</i></div>
  </div>

  <div class="card">
    <h3>✨ 召唤明细</h3>
    <div id="raw-summons" class="raw-list"><i class="muted">暂无召唤数据</i></div>
  </div>

  <div class="card">
    <h3>📦 队伍编成明细</h3>
    <div id="raw-deck"><i class="muted">暂无队伍数据</i></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
