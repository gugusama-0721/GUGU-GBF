<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>GUGU-GBF</title>
<style>
  :root{
    --bg:#10131c;--card:#1b202e;--card2:#222a3c;--line:#2a3352;
    --text:#e8ebf2;--muted:#8f99af;--accent:#5b8cff;--gold:#e8b94a;
    --warn:#ffb454;--danger:#ff5c5c;--ok:#3ecf8e;--fire:#ff6b3d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;padding:14px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;border-bottom:2px solid var(--line);padding-bottom:8px}
  .topbar h1{font-size:15px;color:var(--gold)}
  .topbar .home{color:var(--muted);font-size:12px;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:12px}
  .card h3{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--gold)}
  .card h3 .icon{font-size:14px}
  .muted{color:var(--muted);font-size:11px}

  /* 队伍总览 */
  .deck-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .deck-head .name{font-size:14px;font-weight:700;color:#fff}
  .deck-head .slot{font-size:11px;color:var(--muted)}

  /* 成员缩略条 */
  .members{display:flex;gap:6px}
  .m-cell{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 4px;text-align:center;min-width:0}
  .m-cell .attr{width:14px;height:14px;border-radius:50%;margin:0 auto 4px;border:1px solid rgba(255,255,255,.4)}
  .m-cell .mn{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-cell .ms{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-cell .mnum{font-size:9px;color:var(--gold)}

  /* 角色卡 */
  .ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .ch-card{background:var(--card2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .ch-head{height:74px;position:relative;background:linear-gradient(135deg,#1d2436,#12172a)}
  .ch-avatar{width:40px;height:40px;border-radius:50%;position:absolute;left:7px;bottom:7px;border:2px solid var(--gold);background:#000}
  .ch-attr{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.5)}
  .ch-rarity{position:absolute;top:6px;left:8px;font-size:10px;font-weight:800;color:var(--gold)}
  .ch-body{padding:7px 8px}
  .ch-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-stats{display:flex;gap:8px;font-size:10.5px}
  .ch-stats b{color:var(--accent)}
  .ch-type{font-size:9px;color:var(--muted);margin-top:3px}

  /* 武器盘 */
  .wp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .wp-cell{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center;position:relative;min-width:0}
  .wp-cell.main{border-color:var(--gold)}
  .wp-tag{position:absolute;top:3px;right:5px;font-size:8px;color:var(--gold)}
  .wp-icon{width:34px;height:34px;border-radius:6px;background:#000;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .wp-name{font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wp-atk{font-size:9px;color:var(--muted)}
  .wp-skill{font-size:8px;color:var(--accent);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 召唤栏 */
  .sm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .sm-cell{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center;position:relative}
  .sm-cell.main{border-color:var(--gold)}
  .sm-icon{width:34px;height:34px;border-radius:50%;background:#000;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid var(--line)}
  .sm-name{font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sm-meta{font-size:8.5px;color:var(--muted)}
  .sm-empty{opacity:.45}

  /* 数值统计 */
  .stats{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
  .stat-row:last-child{border-bottom:none}
  .stat-row .label{color:var(--muted)}
  .stat-row .val{font-weight:800;color:var(--gold)}
  .stat-row .bar{height:6px;border-radius:4px;background:var(--card2);margin-top:4px;overflow:hidden}
  .stat-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--fire));border-radius:4px}

  .raw-item{background:var(--card2);border-radius:7px;padding:8px;margin-bottom:6px;border-left:3px solid var(--accent);font-size:11px}
  .raw-item b{color:#fff;font-size:12px}
  .kv{white-space:nowrap;margin-right:8px}
  .btn{width:100%;padding:9px;border:0;border-radius:7px;background:var(--accent);color:#fff;cursor:pointer;font-size:13px;margin-top:6px}
  details{margin-top:6px}summary{font-size:12px;cursor:pointer;color:var(--muted);margin-bottom:4px}
  pre.diag{white-space:pre-wrap;font-family:Consolas,monospace;font-size:11px;color:var(--muted);background:var(--card2);padding:8px;border-radius:6px}
</style>
</head>
<body>
  <div class="topbar">
    <h1>🔥 GUGU-GBF</h1>
    <span class="home" id="btn-home">🏠</span>
  </div>

  <!-- 队伍总览卡 -->
  <div class="card">
    <h3><span class="icon">⚔️</span> 当前队伍</h3>
    <div class="deck-head">
      <span class="name" id="deck-name">未读取</span>
      <span class="slot" id="deck-slot"></span>
    </div>
    <div class="members" id="deck-members"><i class="muted">打开编成页后自动采集</i></div>
  </div>

  <!-- 战斗实时事件卡（WebSocket，复刻 Tarou） -->
  <div class="card">
    <h3><span class="icon">⚡</span> 实时战斗事件</h3>
    <div id="battle-box" style="max-height:180px;overflow:auto"><i class="muted">进入副本战斗后，WebSocket 服务器实时推送事件会显示于此</i></div>
  </div>

  <!-- 数据状态卡（可折叠诊断保留） -->
  <div class="card">
    <h3><span class="icon">📡</span> 数据读取状态</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">
      <span style="background:var(--card2);padding:4px 9px;border-radius:6px;font-size:11px">角色<b id="c-char" style="color:var(--accent);margin-left:4px">-</b></span>
      <span style="background:var(--card2);padding:4px 9px;border-radius:6px;font-size:11px">武器<b id="c-weapon" style="color:var(--accent);margin-left:4px">-</b></span>
      <span style="background:var(--card2);padding:4px 9px;border-radius:6px;font-size:11px">召唤<b id="c-summon" style="color:var(--accent);margin-left:4px">-</b></span>
      <span style="background:var(--card2);padding:4px 9px;border-radius:6px;font-size:11px">队伍<b id="c-deck" style="color:var(--accent);margin-left:4px">-</b></span>
    </div>
    <div class="muted" id="last-update">尚未读取 · 打开游戏页后自动采集</div>
    <button class="btn" id="btn-refresh">🔄 立即读取已截获数据</button>
    <details>
      <summary>🔧 诊断信息（排查用）</summary>
      <pre class="diag" id="diag-box">读取中…</pre>
    </details>
    <details>
      <summary>🔬 原始数据（查看真实接口结构）</summary>
      <pre class="diag" id="raw-box">读取中…</pre>
    </details>
  </div>

  <!-- 角色卡 -->
  <div class="card">
    <h3><span class="icon">🧑‍🤝‍🧑</span> 角色 · 队伍成员</h3>
    <div id="ch-grid" class="ch-grid"><i class="muted">暂无角色数据</i></div>
  </div>

  <!-- 数值统计 -->
  <div class="card">
    <h3><span class="icon">📊</span> 盘面数值统计</h3>
    <div class="stats" id="stats"><i class="muted">数值引擎待接入（参考 Tarou 攻刃/EX/浑身计算）</i></div>
  </div>

  <!-- 武器盘 -->
  <div class="card">
    <h3><span class="icon">🗡️</span> 武器盘 · 主手+副手</h3>
    <div id="wp-grid" class="wp-grid"><i class="muted">暂无武器数据</i></div>
  </div>

  <!-- 召唤栏 -->
  <div class="card">
    <h3><span class="icon">✨</span> 召唤 · 主+副</h3>
    <div id="sm-grid" class="sm-grid"><i class="muted">暂无召唤数据</i></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
