<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="UTF-8">
<title>GUGU-GBF</title>
<style>
  :root{
    --bg:#10131c;--card:#1b202e;--card2:#222a3c;--line:#2a3352;
    --text:#e8ebf2;--muted:#8f99af;--accent:#5b8cff;--gold:#e8b94a;
    --warn:#ffb454;--danger:#ff5c5c;--ok:#3ecf8e;--fire:#ff6b3d;
    --ui-scale:1;
    /* 所有固定尺寸以 --s 基准缩放：--s = Npx*scale，box内文字/图片/间距统一等比 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html, body { width:100%; height:100%; }
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;padding:12px;display:flex;gap:10px;align-items:stretch;overflow:hidden;transform-origin:top left;transform:scale(var(--ui-scale,1));width:calc(100% / var(--ui-scale,1));height:calc(100% / var(--ui-scale,1));font-size:13px;}
  .main{flex:1;min-width:0;min-height:0;height:100%;order:1;overflow-y:auto;overflow-x:hidden;padding:4px 6px 28px 4px;direction:ltr;scrollbar-width:thin;scrollbar-color:transparent transparent}
  .sidebar{width:40px;flex:0 0 40px;display:flex;flex-direction:column;gap:8px;padding-top:4px;order:2;align-items:stretch;overflow-y:auto;overflow-x:hidden;max-height:100vh;direction:rtl;scrollbar-width:thin;scrollbar-color:transparent transparent}
  .main::-webkit-scrollbar,.sidebar::-webkit-scrollbar{width:8px;height:8px;background:transparent}
  .main::-webkit-scrollbar-track,.sidebar::-webkit-scrollbar-track{background:transparent}
  .main::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb{background:transparent;border-radius:999px;min-height:24px}
  .main:hover,.main.is-scrolling,.sidebar:hover,.sidebar.is-scrolling{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
  .main:hover::-webkit-scrollbar-thumb,.main.is-scrolling::-webkit-scrollbar-thumb,.sidebar:hover::-webkit-scrollbar-thumb,.sidebar.is-scrolling::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}
  .topbar{display:none}
  .card{background:transparent;border:0;border-radius:0;padding:8px 0;margin-bottom:12px}
  .card h3{font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--gold)}
  .card h3 .icon{font-size:14px}
  .muted{color:var(--muted);font-size:11px}

  /* 队伍总览 */
  .deck-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .deck-head .name{font-size:14px;font-weight:700;color:#fff}
  .deck-head .slot{font-size:11px;color:var(--muted)}
  .job-info{font-size:11px;color:var(--muted);margin-bottom:8px}
  .job-info b{color:var(--gold);font-weight:700}
  .job-skills{margin-top:3px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .job-skills b{color:var(--accent)}

  /* 成员缩略条 */
  .members{display:flex;gap:6px;flex-wrap:nowrap}
  .m-cell{flex:0 0 78px;background:transparent;border:0;border-radius:0;padding:7px 4px;text-align:center;min-width:0}
  .m-cell .m-avatar{display:block;width:38px;height:38px;object-fit:cover;object-position:center top;border-radius:2px;margin:0 auto 4px;border:0;background:transparent}
  .m-cell .attr{width:14px;height:14px;border-radius:50%;margin:0 auto 4px;border:0}
  .m-cell .mn{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-cell .ms{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-cell .mnum{font-size:9px;color:var(--gold)}

  /* 角色卡 */
  .ch-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%;align-items:start}
  .ch-card{width:100%;min-width:0;background:transparent;border:0;border-radius:0;overflow:visible}
  .ch-head{width:100%;aspect-ratio:49 / 100;position:relative;background:transparent;overflow:visible}
  .ch-image{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:transparent;border:1px solid var(--gold);border-radius:0}
  .ch-body{padding:7px 8px}
  .ch-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-stats{display:flex;gap:8px;font-size:10.5px}
  .ch-stats b{color:var(--accent)}
  .ch-type{font-size:9px;color:var(--muted);margin-top:3px}
  .ch-skills{font-size:8px;color:var(--muted);line-height:1.35;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* 武器盘 */
  .wp-grid{display:grid;grid-template-columns: var(--wp-main-w) repeat(3, minmax(0, 1fr));gap:var(--wp-gap);width:100%;align-items:start;--wp-main-w:100px;--wp-gap:7px}
  .wp-cell{width:100%;min-width:0;aspect-ratio:21/10;background:transparent;border:0;padding:0;text-align:center;position:relative}
  .wp-cell.main{grid-column:1;grid-row:1 / span 4;aspect-ratio:auto;align-self:stretch;display:grid;grid-template-rows:minmax(0,1fr);align-items:stretch}
  .wp-cell.empty{opacity:.22}
  .wp-cell.main{border-color:transparent}
  .wp-tag{position:absolute;top:3px;right:5px;font-size:8px;color:var(--gold)}
  .wp-icon{width:100%;height:100%;border-radius:0;background:transparent;margin:0;display:flex;align-items:center;justify-content:center;font-size:15px;overflow:visible;border:1px solid var(--gold)}
  .wp-cell.main .wp-icon{width:100%;height:100%;min-height:0}
  .wp-image{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
  .wp-name{font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wp-atk{font-size:9px;color:var(--muted)}
  .wp-skill{font-size:8px;color:var(--accent);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 召唤栏：左主召 / 中副召(2列×3行) / 右友召，格式参考武器盘 */
  #sm-grid{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"main subs friend";gap:var(--sm-gap);width:100%;align-items:stretch;--sm-gap:7px}
  #sm-grid .sm-main{grid-area:main;width:96px;min-width:96px;display:flex}
  #sm-grid .sm-subs{grid-area:subs;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:var(--sm-gap);width:100%}
  #sm-grid .sm-friend{grid-area:friend;width:96px;min-width:96px;display:flex;flex-direction:column;gap:var(--sm-gap)}
  .sm-card{width:100%;min-width:0;aspect-ratio:9/12;background:transparent;border:1px solid rgba(232,185,74,.4);border-radius:0;padding:0;text-align:center;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:3px;overflow:hidden}
  .sm-card.main{aspect-ratio:auto;align-self:stretch;border-color:var(--gold)}
  .sm-card.empty{opacity:.22}
  .sm-imgbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px}
  .sm-image{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
  .sm-lbl{font-size:9px;color:var(--muted);line-height:1.35;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sm-lbl b{color:#fff;font-size:10px;display:block;overflow:hidden;text-overflow:ellipsis}
  .sm-lbl span{display:block}

  /* 数值统计 */
  .stats{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
  .stat-row:last-child{border-bottom:none}
  .stat-row .label{color:var(--muted)}
  .stat-row .val{font-weight:800;color:var(--gold)}
  .stat-row .bar{height:6px;border-radius:4px;background:var(--card2);margin-top:4px;overflow:hidden}
  .stat-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--fire));border-radius:4px}

  .raw-item{background:transparent;border-radius:0;padding:4px 0;margin-bottom:6px;border-left:0;font-size:11px}
  .raw-item b{color:#fff;font-size:12px}
  .kv{white-space:nowrap;margin-right:8px}
  .btn{width:100%;padding:9px;border:0;border-radius:7px;background:var(--accent);color:#fff;cursor:pointer;font-size:13px;margin-top:6px}
  details{display:none}
  summary{font-size:12px;cursor:pointer;color:var(--muted);margin-bottom:4px}
  pre.diag{white-space:pre-wrap;font-family:Consolas,monospace;font-size:11px;color:var(--muted);background:transparent;padding:4px 0;border-radius:0}
  .tabs{display:flex;flex-direction:column;gap:8px;margin:0}
  .version-pill{display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;margin-bottom:10px;border-radius:999px;background:rgba(91,140,255,.12);border:1px solid rgba(91,140,255,.35);color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.08em}
  .tab{position:relative;width:100%;height:34px;padding:0;border:0;border-radius:8px;background:var(--card2);color:var(--muted);cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .18s ease;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}
  .tab:hover{background:#2b334a;color:#fff;transform:translateX(-1px)}
  .tab.active{background:var(--accent);color:#fff;box-shadow:0 0 0 1px rgba(91,140,255,.35),inset 0 0 0 1px rgba(255,255,255,.18)}
  .tab-icon{display:inline-block;line-height:1;transform:translateY(-1px)}
  .tab-label{position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);padding:6px 8px;border-radius:7px;background:rgba(16,19,28,.96);color:#fff;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s ease, transform .12s ease;border:1px solid rgba(255,255,255,.08);box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .tab:hover .tab-label, .tab:focus-visible .tab-label{opacity:1;transform:translateY(-50%) translateX(0)}
</style>
</head>
<body>
  <div class="topbar">
    <h1>🔥 GUGU-GBF</h1>
    <span class="home" id="btn-home">🏠</span>
  </div>

  <main class="main">
  <!-- Tab 1: 配队读取 -->
  <div id="panel-deck" class="panel">
  <!-- 队伍总览卡 -->
  <div class="card">
    <h3><span class="icon">⚔️</span> 当前队伍</h3>
    <div class="deck-head">
      <span class="name" id="deck-name">未读取</span>
      <span class="slot" id="deck-slot"></span>
    </div>
    <div class="job-info" id="job-info">主角职业：未读取</div>
    <div class="members" id="deck-members"><i class="muted">打开编成页后自动采集</i></div>
  </div>

  <!-- 角色卡 -->
  <div class="card">
    <h3><span class="icon">🧑‍🤝‍🧑</span> 角色 · 队伍成员</h3>
    <div id="ch-grid" class="ch-grid"><i class="muted">暂无角色数据</i></div>
  </div>

  <!-- 数值统计 -->
  <div class="card">
    <h3><span class="icon">📊</span> 盘面数值统计</h3>
    <div class="stats" id="stats"><i class="muted">数值引擎待接入（参考 Tarou 攻刃/EX/浑身计算）</i></div>
  </div>

  <!-- 武器盘 -->
  <div class="card">
    <h3><span class="icon">🗡️</span> 武器盘 · 主手+副手</h3>
    <div id="wp-grid" class="wp-grid"><i class="muted">暂无武器数据</i></div>
  </div>

  <!-- 召唤栏 -->
  <div class="card">
    <h3><span class="icon">✨</span> 召唤 · 主+副</h3>
    <div id="sm-grid" class="sm-grid"><i class="muted">暂无召唤数据</i></div>
  </div>
  </div><!-- /panel-deck -->

  <!-- Tab 2: 战斗事件 -->
  <div id="panel-battle" class="panel" style="display:none">
  <div class="card">
    <h3><span class="icon">⚡</span> 实时战斗事件</h3>
    <div id="battle-box" style="max-height:260px;overflow:auto"><i class="muted">进入副本战斗后，WebSocket 服务器实时推送事件会显示于此</i></div>
  </div>
  </div><!-- /panel-battle -->
  </main>

  <aside class="sidebar">
    <div class="version-pill" id="plugin-version">v0.1.0</div>
    <div class="tabs">
      <button class="tab active" id="tab-btn-deck" data-tab="deck" aria-label="配队读取">
        <span class="tab-icon">📓</span>
        <span class="tab-label">配队读取</span>
      </button>
      <button class="tab" id="tab-btn-battle" data-tab="battle" aria-label="战斗事件">
        <span class="tab-icon">⚡</span>
        <span class="tab-label">战斗事件</span>
      </button>
    </div>
  </aside>

  <div id="vue-state" hidden aria-hidden="true"></div>
  <script src="vue.global.prod.js"></script>
  <script src="sidepanel.js"></script>

</body></html>
