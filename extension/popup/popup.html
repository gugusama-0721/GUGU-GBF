<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>GUGU-GBF 辅助</title>
  <style>
    :root {
      --bg: #12141c; --card: #1e2330; --text: #e6e9f0;
      --accent: #4f7cff; --warn: #ffb454; --danger: #ff5c5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; background: var(--bg); color: var(--text);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 14px;
    }
    h1 { font-size: 15px; margin-bottom: 12px; color: var(--accent); }
    .card { background: var(--card); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .card h3 { font-size: 13px; margin-bottom: 8px; }
    .team-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .member { background: #2a3142; border-radius: 6px; padding: 6px 10px; font-size: 12px; }
    .label { color: #9aa3b5; font-size: 11px; margin-right: 4px; }
    .advice { font-size: 12px; border-left: 3px solid var(--accent); padding-left: 8px; margin-bottom: 6px; }
    .advice.high { border-color: var(--danger); }
    .advice.medium { border-color: var(--warn); }
    .btn { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; font-size: 13px; }
    .btn:hover { opacity: .9; }
    .status { font-size: 11px; color: #9aa3b5; margin-top: 8px; text-align: center; }
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .field label { font-size: 11px; color: #9aa3b5; display: block; margin-bottom: 2px; }
    .field input, .field select { width: 100%; padding: 5px; border-radius: 5px; border: 1px solid #3a4258; background: #2a3142; color: var(--text); font-size: 12px; }
    .raw-list { font-size: 11px; color: #bdc5d6; }
    .raw-item { background: #232a3c; border-radius: 6px; padding: 8px; margin-bottom: 6px; border-left: 3px solid var(--accent); }
    .raw-item b { color: #fff; }
    .raw-field { color: #8f98ab; }
    .kv { white-space: nowrap; }
  </style>
</head>
<body>
  <h1>GUGU-GBF 辅助</h1>

  <div class="card">
    <h3>📡 数据读取状态（与网页核对用）</h3>
    <div style="font-size:12px; margin-bottom:6px">
      <span class="label">角色</span><span id="c-char">-</span>&nbsp;
      <span class="label">武器</span><span id="c-weapon">-</span>&nbsp;
      <span class="label">召唤</span><span id="c-summon">-</span>&nbsp;
      <span class="label">队伍</span><span id="c-deck">-</span>
    </div>
    <div style="font-size:11px;color:#9aa3b5;margin-bottom:8px" id="last-update">尚未读取 · 打开游戏页后自动采集</div>
    <button class="btn" id="btn-refresh" style="margin-bottom:6px">🔄 立即读取已截获数据</button>
    <details>
      <summary style="font-size:12px;cursor:pointer">🔧 诊断信息（排查用）</summary>
      <div class="status" id="diag-box" style="text-align:left;white-space:pre-wrap;font-family:monospace;font-size:11px">读取中…</div>
    </details>
    <details>
      <summary style="font-size:12px;cursor:pointer">ℹ️ 数据采集说明</summary>
      <div class="status" style="text-align:left">
        打开 GBF 的队伍编成页、角色一览页、武器/召唤页时，扩展会自动截获接口返回并在此显示。
        若数量为 0，请先打开对应页面后再点「立即读取」。
      </div>
    </details>
  </div>

  <div class="card">
    <h3>📦 角色明细（读取原始字段）</h3>
    <div id="raw-characters" class="raw-list"><i>暂无角色数据</i></div>
  </div>

  <div class="card">
    <h3>🔫 武器明细</h3>
    <div id="raw-weapons" class="raw-list"><i>暂无武器数据</i></div>
  </div>

  <div class="card">
    <h3>✨ 召唤明细</h3>
    <div id="raw-summons" class="raw-list"><i>暂无召唤数据</i></div>
  </div>

  <div class="card">
    <h3>📦 队伍编成明细</h3>
    <div id="raw-deck"><i>暂无队伍数据</i></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
